aid: atera
name: Atera
description: 'Atera Networks Ltd. operates an all-in-one IT management platform that
  combines remote monitoring and management (RMM), professional services automation
  (PSA), helpdesk and ticketing, patch management, network discovery, remote access
  (Splashtop, AnyDesk, TeamViewer, ScreenConnect), reporting, and billing/invoicing
  in a single per-technician subscription used by managed service providers and internal
  IT departments. Its AI layer adds Action AI, AI Copilot, and Robin (IT Autopilot),
  and an AI Center that lets administrators install Model Context Protocol (MCP) integrations
  from a catalog or register custom MCP servers so Atera''s own agents can reach outside
  systems. Atera is programmable through a versioned REST API at https://app.atera.com/api/v3
  covering twelve data domains (agents, alerts, billing, contacts, contracts, customers,
  custom values, departments, devices, knowledge base, rates, tickets) authenticated
  with an X-API-KEY token, plus outbound webhooks bound to ticket automation rules.
  Atera states its API is driven by OpenAPI 3.0, but the interactive reference at
  https://app.atera.com/apidocs requires an account token before it will render and
  no specification is published at a public URL.'
