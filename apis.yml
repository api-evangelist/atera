apis:
- name: Atera API v3
  description: 'Atera''s REST API. Twelve data domains — Agents, Alerts, Billing,
    Contacts, Contracts, Customers, CustomValues, Departments, Devices, KnowledgeBase,
    Rates and Tickets — reachable over HTTPS only at https://app.atera.com/api/v3 and
    authenticated with an account API token supplied in the X-API-KEY request header.
    Tokens are created in Admin > Data management > API with an expiration date (one
    year maximum), an optional IP allowlist, and either full access or custom per-domain
    Read/Write/Delete permissions. API access is included in every paid subscription
    but is disabled during the free trial.'
