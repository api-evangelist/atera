- date: '2026-06'
  version: null
  breaking: false
  api_relevant: true
  highlights:
  - 'API token support: multiple API tokens with configurable expiration dates, IP
    restrictions and permission scopes.'
  - Admins can require MFA for protected/irreversible actions.
  - New-device-detected email notifications with an unauthorized-access report action.
  - '"Beginner" view-only preset added to technician permissions.'
  - IT Autopilot renamed to Robin; Robin gains a Salesforce integration; AI Center
    access can be granted to non-admins via roles and permissions.
- date: '2026-05'
  version: null
  breaking: false
  api_relevant: false
  highlights:
  - AI Center ticket-flow breakdown for Robin.
  - Automatic child-ticket creation from ticket automation rules.
  - Windows OS patch release dates surfaced on the Patch Management page.
  - Global search across custom fields, assets, KB articles and ticket comments.
  - Network Discovery credential requests, workgroup agent deployment, dedicated SNMP
    scan type; Copilot-generated SNMP OIDs.
- date: '2026-04'
  version: null
  breaking: false
  api_relevant: true
  highlights:
  - 'Cloud actions can now call Atera ticketing APIs, letting AI Copilot and Robin
    escalate, resolve and update tickets end to end.'
  - Lenovo warranty/purchase sync for assets.
  - Multiple email addresses can be bound to a single user/contact.
  - Ticket form templates segmentable by site/customer; folder-level technician access
    restrictions.
- date: '2026-03'
  version: null
  breaking: false
  api_relevant: false
  highlights:
  - Multiple devices linkable to a single user/contact.
  - Monitored device experience (HTTP, SNMP, TCP, Generic) rebuilt; AI-generated OIDs
    from prompts or MIB files.
  - Security audit logs expanded to cover authentication events, permission changes,
    sensitive actions and access attempts, including remote connections, agent activity
    and integrations.
  - Robin multilingual support across 23 languages.
- date: '2026-02'
  version: null
  breaking: false
