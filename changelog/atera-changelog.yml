  highlights:
  - '"Keyp it secure for APIce of mind": advanced API tokens with IP allowlisting and
    granular permissions, initially available to new accounts only and rolling out
    more broadly.'
  - Microsoft Entra ID user sync per site.
  - Passkey/biometric login.
  - IT Autopilot playbooks, follow-up policy tuning, and expanded file-type analysis.

