standards:
- id: rest
  conforms: true
  evidence: >-
    Atera documents GET/POST/PUT/DELETE against resource collections under
    https://app.atera.com/api/v3 and states that "a strong grasp of HTTP/HTTPS and
    RESTful design principles is required" (API FAQ).
- id: openapi-3.0
  conforms: partial
  evidence: >-
    "Atera employs OpenAPI 3.0 to drive its API." — Atera API FAQ. The document itself is
    served only to authenticated tenants at https://app.atera.com/apidocs (401 anonymous)
    and is not published at any public URL, so the claim cannot be verified and the spec
    cannot be consumed by an integrator or agent.
- id: oauth2
