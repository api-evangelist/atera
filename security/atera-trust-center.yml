notes: >-
  trust.atera.com resolves and returns HTTP 200 with <title>Atera Trust Center</title>
  and a canonical link to itself, served as a Vanta-hosted single-page app. The page
  content — the certification list, subprocessors and document requests — is rendered
  client-side from a GraphQL endpoint that rejects unsigned requests
  ("Missing `signature` or `signedAt`", HTTP 400), so the certification roster could
  NOT be read anonymously. Only certifications with an independent first-party source
  are recorded as verified below; the rest are deliberately left unasserted rather than
  copied from secondhand summaries.

certifications_verified:
- name: SOC 2 Type 2
  source: https://community.atera.com/discussion/335/were-officially-soc-2-type-2-certified
  source_type: Atera admin announcement on Atera's own community
  announced: '2024-01'

certifications_unverified:
  note: >-
    Third-party summaries of trust.atera.com list ISO/IEC 27001, 27017, 27018, 27032 and
    42001, HIPAA, GDPR and CCPA alongside SOC 2 Type 2. These could not be confirmed
    against a page this pipeline could actually read, so they are recorded as unverified
    rather than claimed.

subprocessors:
  url: https://trust.atera.com/subprocessors
  status: 200
  readable: false
  note: SPA route; returns the same client-rendered shell.

